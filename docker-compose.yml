# Self-hosting example: PostgreSQL + the application with persistent volumes.
# 1. Create a .env file next to this file with SESSION_SECRET, POSTGRES_PASSWORD and APP_BASE_URL.
# 2. docker compose up -d
# 3. docker compose exec -it app node server/dist/cli/create-admin.js --email you@charity.ca --name "Your Name"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: empty_bowls
      POSTGRES_USER: empty_bowls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://empty_bowls:${POSTGRES_PASSWORD}@db:5432/empty_bowls
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
    volumes:
      - uploads:/data
volumes:
  pgdata:
  uploads:
